{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}Input Penebusan Stok{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0 fw-bold">📥 Input Penebusan (Stock In)</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {% bootstrap_form form %}
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary me-md-2">Batal</a>
                        <button type="submit" class="btn btn-success fw-bold">💾 Simpan Stok</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
